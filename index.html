<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeHub - Онлайн просмотр</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d1a;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 16px 20px 30px;
            min-height: 100vh;
        }
        .wrap { max-width: 1200px; margin: 0 auto; }

        .header {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #7c3aed;
            cursor: pointer;
            white-space: nowrap;
        }
        .logo span { color: #fff; }
        .search {
            display: flex;
            flex: 1;
            gap: 8px;
            max-width: 450px;
            min-width: 200px;
        }
        .search input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 30px;
            border: 2px solid #2a2a4a;
            background: #1a1a2e;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .search input:focus { border-color: #7c3aed; }
        .search button {
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            background: #7c3aed;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
        .search button:hover { background: #6d28d9; }

        .nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            border-bottom: 1px solid #1a1a2e;
            padding-bottom: 12px;
        }
        .nav button {
            background: transparent;
            border: none;
            color: #888;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
        }
        .nav button:hover { color: #fff; background: #1a1a2e; }
        .nav button.active {
            color: #fff;
            background: #2a2a4a;
            border: 1px solid #7c3aed;
        }
        .nav button .badge {
            background: #7c3aed;
            color: #fff;
            padding: 1px 8px;
            border-radius: 20px;
            font-size: 11px;
            margin-left: 4px;
        }

        .stats {
            display: flex;
            gap: 24px;
            padding: 10px 0;
            margin-bottom: 16px;
            color: #888;
            font-size: 13px;
            flex-wrap: wrap;
            border-bottom: 1px solid #1a1a2e;
        }
        .stats span:last-child { color: #fff; }

        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 20px;
            min-height: 200px;
            margin-top: 16px;
        }

        .card {
            background: #1a1a2e;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #2a2a4a;
            transition: all 0.3s;
            position: relative;
        }
        .card:hover {
            transform: translateY(-6px);
            border-color: #7c3aed;
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.15);
        }
        .card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
        }
        .card-body { padding: 12px 14px 14px; }
        .card-body h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }
        .card-body .meta {
            font-size: 12px;
            color: #888;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 4px 0 6px;
        }
        .card-body .meta span {
            background: #2a2a4a;
            padding: 2px 10px;
            border-radius: 20px;
        }
        .card-body .meta .score { color: #fbbf24; }
        .card-body .status-line {
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
            padding-top: 8px;
            border-top: 1px solid #2a2a4a;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.green { background: #4ade80; }
        .status-dot.blue { background: #60a5fa; }
        .status-dot.gray { background: #666; }

        .fav-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            border: none;
            color: #888;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .fav-btn:hover { transform: scale(1.1); }
        .fav-btn.active { color: #ef4444; }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty h3 { font-size: 22px; margin-top: 10px; }
        .empty i { font-size: 48px; color: #1a1a2e; }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #1a1a2e;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { color: #888; margin-top: 12px; }

        /* ===== ПЛЕЕР ===== */
        #player {
            margin-top: 30px;
            background: #1a1a2e;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #2a2a4a;
        }
        #player.hidden { display: none; }
        .player-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .player-top h2 { font-size: 18px; }
        .player-top .btns { display: flex; gap: 8px; }
        .player-top .btns button {
            background: #2a2a4a;
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .player-top .btns button:hover { background: #3a3a5a; }
        .player-top .btns .close:hover { background: #dc2626; }

        .player-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            padding: 10px;
            background: #0d0d1a;
            border-radius: 10px;
            align-items: center;
        }
        .player-controls select {
            background: #2a2a4a;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .player-controls .status {
            color: #7c3aed;
            font-size: 13px;
        }
        .player-controls .source-btn {
            background: #2a2a4a;
            border: none;
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
        }
        .player-controls .source-btn:hover { background: #3a3a5a; }
        .player-controls .source-btn.kodik { background: #7c3aed; }
        .player-controls .source-btn.kodik:hover { background: #6d28d9; }

        /* ===== IFRAME ПЛЕЕР ===== */
        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #0d0d1a;
            border-radius: 12px;
            overflow: hidden;
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #0d0d1a;
        }

        .msg {
            padding: 10px 14px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 14px;
        }
        .msg.info { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .msg.success { background: rgba(52, 211, 153, 0.1); border: 1px solid rgba(52, 211, 153, 0.2); color: #4ade80; }
        .msg.error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171; }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #1a1a2e;
            text-align: center;
            color: #555;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: stretch; }
            .search { max-width: 100%; }
            #grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
            .nav { gap: 6px; }
            .nav button { font-size: 12px; padding: 6px 12px; }
        }
    </style>
</head>
<body>
<div class="wrap">

    <div class="header">
        <div class="logo" id="logoLink">🎬 Anime<span>Hub</span></div>
        <div class="search">
            <input type="text" id="searchInput" placeholder="Поиск аниме...">
            <button id="searchBtn">🔍 Найти</button>
        </div>
    </div>

    <div class="nav" id="nav">
        <button class="active" data-tab="ongoing">🔄 Онгоинги</button>
        <button data-tab="top">🏆 Топ-100</button>
        <button data-tab="favorites">⭐ Избранное <span class="badge" id="favCount">0</span></button>
        <button data-tab="search" id="searchTab">🔍 Поиск</button>
    </div>

    <div class="stats">
        <span id="currentTabLabel">📺 Онгоинги</span>
        <span id="count">0 аниме</span>
    </div>

    <div id="grid"></div>

    <!-- ПЛЕЕР -->
    <div id="player" class="hidden">
        <div class="player-top">
            <h2 id="playerTitle">Название</h2>
            <div class="btns">
                <button id="closePlayer" class="close">✕</button>
            </div>
        </div>
        <div class="player-controls">
            <select id="episodeSelect"></select>
            <span class="status" id="sourceStatus">⏳ Загрузка...</span>
            <button class="source-btn" id="nextSourceBtn">▶ Следующий</button>
            <button class="source-btn" id="reloadBtn">🔄 Обновить</button>
        </div>

        <!-- IFRAME ПЛЕЕР -->
        <div class="player-wrapper">
            <iframe id="playerFrame" src="" allowfullscreen></iframe>
        </div>

        <div id="statusMsg" class="msg info">💡 Выберите аниме</div>
        <div id="debugInfo" style="display:none;margin-top:10px;padding:10px;background:#1a1a2e;border-radius:8px;font-size:12px;color:#888;word-break:break-all;max-height:150px;overflow-y:auto;white-space:pre-wrap;"></div>
    </div>

    <div class="footer">AniList · Встроенный плеер</div>
</div>

<script>
// ============================================================
// РАБОЧИЙ ПЛЕЕР - IFRAME
// ============================================================

(function() {
    'use strict';

    // ===== DOM =====
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const grid = document.getElementById('grid');
    const count = document.getElementById('count');
    const currentTabLabel = document.getElementById('currentTabLabel');
    const logo = document.getElementById('logoLink');
    const nav = document.getElementById('nav');
    const favCount = document.getElementById('favCount');
    const searchTab = document.getElementById('searchTab');

    const player = document.getElementById('player');
    const playerTitle = document.getElementById('playerTitle');
    const playerFrame = document.getElementById('playerFrame');
    const closePlayer = document.getElementById('closePlayer');
    const episodeSelect = document.getElementById('episodeSelect');
    const statusMsg = document.getElementById('statusMsg');
    const sourceStatus = document.getElementById('sourceStatus');
    const reloadBtn = document.getElementById('reloadBtn');
    const nextSourceBtn = document.getElementById('nextSourceBtn');
    const debugInfo = document.getElementById('debugInfo');

    // ===== STATE =====
    let currentTab = 'ongoing';
    let currentResults = [];
    let currentAnime = null;
    let isLoading = false;
    let favorites = JSON.parse(localStorage.getItem('animeFavorites') || '[]');
    let currentSourceIndex = 0;
    let currentSources = [];

    // ===== ANILIST QUERY =====
    const ANILIST_QUERY = `
        query ($page: Int, $perPage: Int, $search: String, $sort: [MediaSort], $status: MediaStatus) {
            Page(page: $page, perPage: $perPage) {
                media(search: $search, sort: $sort, status: $status, type: ANIME) {
                    id
                    title { romaji english native }
                    coverImage { large extraLarge }
                    format
                    episodes
                    status
                    averageScore
                    genres
                    seasonYear
                }
            }
        }
    `;

    // ===== РАБОЧИЕ ИСТОЧНИКИ ДЛЯ IFRAME =====
    function getPlayerSources(id, episode) {
        return [
            `https://animeflix.live/embed/${id}?ep=${episode}`,
            `https://gogoanime.llc/embed/${id}?ep=${episode}`,
            `https://aniwatch.to/embed/${id}?ep=${episode}`,
            `https://zoro.to/embed/${id}?ep=${episode}`,
            `https://allanime.to/embed/${id}?ep=${episode}`,
            `https://animepahe.com/embed/${id}?ep=${episode}`,
            `https://9anime.to/embed/${id}?ep=${episode}`
        ];
    }

    // ===== FAVORITES =====
    function saveFavorites() {
        localStorage.setItem('animeFavorites', JSON.stringify(favorites));
        favCount.textContent = favorites.length;
    }

    function toggleFavorite(id) {
        const idx = favorites.indexOf(id);
        if (idx > -1) { favorites.splice(idx, 1); }
        else { favorites.push(id); }
        saveFavorites();
        renderCurrentView();
    }

    function isFavorite(id) { return favorites.includes(id); }

    // ===== RENDER CARDS =====
    function renderCards(list, showFavBtn = true) {
        if (!list || list.length === 0) {
            grid.innerHTML = `<div class="empty"><i>📭</i><h3>Ничего не найдено</h3></div>`;
            return;
        }
        let html = '';
        for (const anime of list) {
            const title = anime.title?.romaji || anime.title?.english || 'Без названия';
            const cover = anime.coverImage?.extraLarge || anime.coverImage?.large || '';
            const genres = (anime.genres || []).slice(0, 2).join(' · ');
            const score = anime.averageScore ? Math.round(anime.averageScore / 10) : '—';
            const episodes = anime.episodes || '?';
            const status = anime.status || 'UNKNOWN';
            const statusLabel = status === 'RELEASING' ? '🟢 Выходит' : status === 'FINISHED' ? '🔵 Завершён' : '⚪ Скоро';
            const dotClass = status === 'RELEASING' ? 'green' : status === 'FINISHED' ? 'blue' : 'gray';
            const fav = isFavorite(anime.id);

            html += `
                <div class="card" data-id="${anime.id}" data-title="${encodeURIComponent(title)}">
                    ${showFavBtn ? `<button class="fav-btn ${fav ? 'active' : ''}" data-id="${anime.id}">${fav ? '❤️' : '🤍'}</button>` : ''}
                    <img src="${cover}" alt="${title}" loading="lazy"
                         onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22450%22%3E%3Crect fill=%22%231a1a2e%22 width=%22300%22 height=%22450%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 font-size=%2220%22 fill=%22%23666%22 text-anchor=%22middle%22 dominant-baseline=%22central%22%3ENo Image%3C/text%3E%3C/svg%3E'" />
                    <div class="card-body">
                        <h3>${escapeHtml(title)}</h3>
                        ${genres ? `<div style="font-size:12px;color:#888;margin:2px 0;">${escapeHtml(genres)}</div>` : ''}
                        <div class="meta">
                            <span>${anime.format || 'TV'}</span>
                            <span class="score">⭐ ${score}</span>
                            <span>${episodes} эп.</span>
                            ${anime.seasonYear ? `<span>${anime.seasonYear}</span>` : ''}
                        </div>
                        <div class="status-line">
                            <span class="status-dot ${dotClass}"></span>
                            ${statusLabel}
                        </div>
                    </div>
                </div>
            `;
        }
        grid.innerHTML = html;

        document.querySelectorAll('.card').forEach(el => {
            el.addEventListener('click', function(e) {
                if (e.target.closest('.fav-btn')) return;
                const id = parseInt(this.dataset.id);
                const title = decodeURIComponent(this.dataset.title);
                const anime = currentResults.find(a => a.id === id);
                if (anime) openPlayer(anime, title);
            });
        });

        document.querySelectorAll('.fav-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = parseInt(this.dataset.id);
                toggleFavorite(id);
                const isFav = isFavorite(id);
                this.textContent = isFav ? '❤️' : '🤍';
                this.classList.toggle('active', isFav);
            });
        });
    }

    // ===== LOAD ANIME =====
    async function loadAnime(tab, search = '') {
        if (isLoading) return;
        isLoading = true;
        showLoading();

        try {
            let variables = { page: 1, perPage: 30 };
            let label = '';

            if (tab === 'ongoing') {
                variables.status = 'RELEASING';
                variables.sort = ['POPULARITY_DESC'];
                label = '📺 Онгоинги';
            } else if (tab === 'top') {
                variables.sort = ['SCORE_DESC'];
                label = '🏆 Топ-100';
            } else if (tab === 'favorites') {
                if (favorites.length === 0) {
                    grid.innerHTML = `<div class="empty"><i>⭐</i><h3>Нет избранных</h3><p>Добавьте аниме в избранное ❤️</p></div>`;
                    count.textContent = '0';
                    isLoading = false;
                    return;
                }
                const res = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: `
                            query ($ids: [Int]) {
                                Page(page: 1, perPage: 50) {
                                    media(id_in: $ids, type: ANIME, sort: [POPULARITY_DESC]) {
                                        id
                                        title { romaji english native }
                                        coverImage { large extraLarge }
                                        format
                                        episodes
                                        status
                                        averageScore
                                        genres
                                        seasonYear
                                    }
                                }
                            }
                        `,
                        variables: { ids: favorites }
                    })
                });
                const json = await res.json();
                const media = json?.data?.Page?.media || [];
                currentResults = media;
                renderCards(media);
                count.textContent = `${media.length} избранных`;
                isLoading = false;
                return;
            } else if (tab === 'search' && search) {
                variables.search = search;
                variables.sort = ['POPULARITY_DESC'];
                label = `🔍 Результаты: "${search}"`;
            } else {
                isLoading = false;
                return;
            }

            const res = await fetch('https://graphql.anilist.co', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: ANILIST_QUERY, variables })
            });
            const json = await res.json();
            const media = json?.data?.Page?.media || [];
            currentResults = media;
            renderCards(media);
            count.textContent = `${media.length} аниме`;
            currentTabLabel.textContent = label || '';

        } catch (err) {
            console.error(err);
            grid.innerHTML = `<div class="empty"><i>❌</i><h3>Ошибка загрузки</h3><p>${err.message}</p></div>`;
        } finally {
            isLoading = false;
        }
    }

    function renderCurrentView() {
        const tab = currentTab;
        if (tab === 'search') {
            const q = searchInput.value.trim();
            if (q) loadAnime('search', q);
            else { grid.innerHTML = `<div class="empty"><i>🔍</i><h3>Введите запрос</h3></div>`; count.textContent = '0'; }
            return;
        }
        loadAnime(tab);
    }

    // ===== OPEN PLAYER =====
    function openPlayer(anime, title) {
        currentAnime = anime;
        const animeTitle = title || anime.title?.romaji || anime.title?.english || 'Аниме';

        player.classList.remove('hidden');
        playerTitle.textContent = '🎬 ' + animeTitle;

        const total = anime.episodes || 12;
        episodeSelect.innerHTML = '';
        for (let i = 1; i <= Math.min(total, 50); i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `Серия ${i}`;
            episodeSelect.appendChild(opt);
        }

        currentSourceIndex = 0;
        const ep = parseInt(episodeSelect.value) || 1;
        currentSources = getPlayerSources(anime.id, ep);
        loadSource(0);

        setTimeout(() => {
            player.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
    }

    // ===== LOAD SOURCE =====
    function loadSource(index) {
        if (index >= currentSources.length) {
            setStatus('❌ Все источники попробованы', 'error');
            sourceStatus.textContent = '❌ Нет доступных источников';
            return;
        }

        currentSourceIndex = index;
        const url = currentSources[index];
        
        sourceStatus.textContent = `🔄 Источник ${index + 1}/${currentSources.length}`;
        setStatus(`⏳ Загрузка...`, 'info');
        debugInfo.textContent = `Попытка ${index + 1}: ${url}`;
        debugInfo.style.display = 'block';

        playerFrame.src = url;

        // Таймаут для переключения
        let timeoutId = setTimeout(() => {
            loadSource(index + 1);
        }, 8000);

        playerFrame.onload = function() {
            clearTimeout(timeoutId);
            setStatus('✅ Видео загружено!', 'success');
            sourceStatus.textContent = `✅ Источник ${index + 1} работает`;
            debugInfo.style.display = 'none';
        };

        playerFrame.onerror = function() {
            clearTimeout(timeoutId);
            loadSource(index + 1);
        };
    }

    // ===== NEXT SOURCE =====
    function nextSource() {
        if (currentAnime) {
            const ep = parseInt(episodeSelect.value) || 1;
            currentSources = getPlayerSources(currentAnime.id, ep);
            loadSource(currentSourceIndex + 1);
        }
    }

    // ===== CHANGE EPISODE =====
    function changeEpisode() {
        if (currentAnime) {
            const ep = parseInt(episodeSelect.value) || 1;
            currentSourceIndex = 0;
            currentSources = getPlayerSources(currentAnime.id, ep);
            loadSource(0);
        }
    }

    // ===== RELOAD =====
    function reloadPlayer() {
        if (currentAnime) {
            const ep = parseInt(episodeSelect.value) || 1;
            currentSourceIndex = 0;
            currentSources = getPlayerSources(currentAnime.id, ep);
            loadSource(0);
        }
    }

    // ===== SET STATUS =====
    function setStatus(msg, type) {
        statusMsg.textContent = msg;
        statusMsg.className = 'msg ' + (type || 'info');
    }

    // ===== CLOSE PLAYER =====
    function closePlayerFn() {
        player.classList.add('hidden');
        playerFrame.src = '';
        currentAnime = null;
        debugInfo.style.display = 'none';
    }

    // ===== GO HOME =====
    function goHome() {
        closePlayerFn();
        currentTab = 'ongoing';
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-tab="ongoing"]')?.classList.add('active');
        loadAnime('ongoing');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ===== UI HELPERS =====
    function showLoading() {
        grid.innerHTML = `<div class="loading"><div class="spinner"></div><p>Загрузка...</p></div>`;
    }

    function escapeHtml(text) {
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    // ===== NAVIGATION =====
    nav.addEventListener('click', function(e) {
        const btn = e.target.closest('button');
        if (!btn) return;
        const tab = btn.dataset.tab;
        if (!tab) return;
        if (tab === 'search') {
            searchInput.focus();
            return;
        }
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = tab;
        renderCurrentView();
    });

    searchTab.addEventListener('click', function() {
        searchInput.focus();
        const q = searchInput.value.trim();
        if (q) {
            currentTab = 'search';
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            loadAnime('search', q);
        }
    });

    searchBtn.addEventListener('click', function() {
        const q = searchInput.value.trim();
        if (q) {
            currentTab = 'search';
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            searchTab.classList.add('active');
            loadAnime('search', q);
        }
    });

    searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') searchBtn.click();
    });

    // ===== PLAYER EVENTS =====
    closePlayer.addEventListener('click', closePlayerFn);
    episodeSelect.addEventListener('change', changeEpisode);
    reloadBtn.addEventListener('click', reloadPlayer);
    nextSourceBtn.addEventListener('click', nextSource);

    logo.addEventListener('click', goHome);

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && !player.classList.contains('hidden')) {
            closePlayerFn();
        }
    });

    // ===== INIT =====
    saveFavorites();
    loadAnime('ongoing');

})();
</script>
</body>
</html>
