<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stas Anime - VK плеер</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: #e8e8f0;
            font-family: Arial, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        .wrap { max-width: 1100px; margin: 0 auto; }

        .header {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 28px;
            font-weight: 900;
            color: #7c3aed;
            cursor: pointer;
        }
        .search {
            display: flex;
            flex: 1;
            gap: 8px;
            max-width: 500px;
        }
        .search input {
            flex: 1;
            padding: 10px 18px;
            border-radius: 30px;
            border: 2px solid #2a2a4a;
            background: #14142a;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .search input:focus { border-color: #7c3aed; }
        .search button {
            padding: 10px 24px;
            border-radius: 30px;
            border: none;
            background: #7c3aed;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
        .search button:hover { background: #6d28d9; }

        .info {
            color: #666;
            font-size: 14px;
            padding: 10px 0;
            border-bottom: 1px solid #1a1a36;
            margin-bottom: 16px;
        }

        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            min-height: 100px;
            margin-bottom: 20px;
        }

        .result-item {
            background: #14142a;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #1a1a36;
            transition: 0.3s;
        }
        .result-item:hover {
            transform: translateY(-4px);
            border-color: #7c3aed;
        }
        .result-item .thumb {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            background: #0a0a1a;
        }
        .result-item .info {
            padding: 10px 14px;
            border-bottom: none;
            margin: 0;
        }
        .result-item .info h4 {
            font-size: 14px;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .result-item .info .source {
            font-size: 12px;
            color: #666;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: #555;
        }
        .empty i { font-size: 40px; color: #1a1a36; display: block; margin-bottom: 10px; }
        .empty h3 { font-size: 18px; }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #1a1a36;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { color: #666; margin-top: 10px; }

        /* ===== ПЛЕЕР ===== */
        #player {
            margin-top: 20px;
            background: #14142a;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #1a1a36;
            animation: slideUp 0.3s ease;
        }
        #player.hidden { display: none; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .player-header h3 { font-size: 17px; }
        .player-header button {
            background: #1a1a36;
            border: none;
            color: #888;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
        }
        .player-header button:hover { background: #dc2626; color: #fff; }

        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #0a0a1a;
            border-radius: 12px;
            overflow: hidden;
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #0a0a1a;
        }

        .player-status {
            padding: 8px 14px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 13px;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }
        .player-status.error {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
            color: #f87171;
        }
        .player-status.success {
            background: rgba(52, 211, 153, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.15);
            color: #4ade80;
        }

        .footer {
            margin-top: 30px;
            padding-top: 16px;
            border-top: 1px solid #1a1a36;
            text-align: center;
            color: #444;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: stretch; }
            .search { max-width: 100%; }
            #results { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="wrap">
    <header class="header">
        <div class="logo">🎬 StasAnime</div>
        <div class="search">
            <input type="text" id="searchInput" placeholder="Название и серия..." value="one piece 1 серия">
            <button id="searchBtn">🔍 Найти</button>
        </div>
    </header>

    <div class="info">📺 Введите название аниме и номер серии (например: "Блич 1 серия")</div>

    <div id="results"></div>

    <!-- ПЛЕЕР ТОЛЬКО VK -->
    <div id="player" class="hidden">
        <div class="player-header">
            <h3 id="playerTitle">🎬 Название</h3>
            <button id="closePlayer">✕</button>
        </div>
        <div class="player-wrapper">
            <iframe id="playerFrame" src="" allowfullscreen></iframe>
        </div>
        <div id="playerStatus" class="player-status">💡 Выберите видео</div>
    </div>

    <footer class="footer">Stas Anime · Поиск только VK</footer>
</div>

<script src="app.js"></script>
</body>
</html>
