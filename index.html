<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stas Anime - Простой плеер</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="wrap">
    <header class="header">
        <div class="logo">🎬 StasAnime</div>
        <div class="search">
            <input type="text" id="searchInput" placeholder="Название аниме..." value="one piece">
            <button id="searchBtn">🔍 Найти</button>
        </div>
    </header>

    <div class="info">📺 Найди аниме и смотри онлайн</div>

    <!-- Результаты поиска -->
    <div id="results"></div>

    <!-- Плеер -->
    <div id="player" class="hidden">
        <div class="player-header">
            <h3 id="playerTitle">🎬 Название</h3>
            <button id="closePlayer">✕</button>
        </div>

        <div class="player-container">
            <video id="videoPlayer" controls>
                <source id="videoSource" src="" type="video/mp4">
                Ваш браузер не поддерживает видео
            </video>
        </div>

        <div class="player-controls">
            <button id="playBtn">▶️</button>
            <span id="timeDisplay">00:00 / 00:00</span>
            <input type="range" id="progressBar" value="0">
            <button id="fullscreenBtn">⛶</button>
        </div>

        <div id="playerStatus" class="status-info">💡 Выберите видео</div>
    </div>

    <!-- Загрузка -->
    <div id="loading" style="display:none; text-align:center; padding:40px;">
        <div class="spinner"></div>
        <p style="color:#888; margin-top:10px;">Поиск видео...</p>
    </div>

    <footer class="footer">Stas Anime · Поиск по YouTube и VK</footer>
</div>

<script src="app.js"></script>
</body>
</html>
