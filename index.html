<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeHub - Смотреть аниме онлайн</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="wrap">
        <!-- HEADER -->
        <header class="header">
            <div class="logo" id="logoLink">
                <i class="fas fa-film"></i>
                <span>Anime<span>Hub</span></span>
            </div>
            <div class="header-right">
                <div class="search">
                    <input type="text" id="searchInput" placeholder="Поиск аниме...">
                    <button id="searchBtn"><i class="fas fa-search"></i></button>
                </div>
                <div class="auth-btns" id="authBtns">
                    <button class="btn-login" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Вход</button>
                    <button class="btn-register" id="registerBtn"><i class="fas fa-user-plus"></i> Регистрация</button>
                </div>
                <div class="auth-btns" id="userInfo" style="display:none;">
                    <span class="user-name" id="userNameDisplay"><i class="fas fa-user"></i> </span>
                    <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </header>

        <!-- NAV -->
        <nav class="nav" id="nav">
            <button class="active" data-tab="ongoing"><i class="fas fa-sync-alt"></i> Онгоинги</button>
            <button data-tab="top"><i class="fas fa-trophy"></i> Топ-100</button>
            <button data-tab="favorites"><i class="fas fa-heart"></i> Избранное <span class="badge" id="favCount">0</span></button>
            <button data-tab="search" id="searchTab"><i class="fas fa-search"></i> Поиск</button>
        </nav>

        <!-- STATS -->
        <div class="stats">
            <span id="currentTabLabel"><i class="fas fa-play-circle"></i> Онгоинги</span>
            <span id="count"><i class="fas fa-list"></i> 0 аниме</span>
        </div>

        <!-- GRID -->
        <div id="grid"></div>

        <!-- PLAYER -->
        <div id="player" class="hidden">
            <div class="player-top">
                <h2 id="playerTitle"><i class="fas fa-play-circle" style="color:#7c3aed;"></i> Название</h2>
                <div class="btns">
                    <button id="closePlayer" class="close"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="player-controls">
                <select id="episodeSelect"></select>
                <span class="status" id="sourceStatus"><i class="fas fa-spinner fa-spin"></i> Загрузка...</span>
                <button id="nextSourceBtn"><i class="fas fa-forward"></i> Следующий</button>
                <button id="reloadBtn"><i class="fas fa-sync-alt"></i></button>
            </div>
            <div class="player-wrapper">
                <iframe id="playerFrame" src="" allowfullscreen></iframe>
            </div>
            <div id="statusMsg" class="msg info"><i class="fas fa-info-circle"></i> Выберите аниме</div>
            <div id="debugInfo"></div>
        </div>

        <footer class="footer">
            <p><i class="fas fa-code"></i> AnimeHub · Данные AniList · Встроенный плеер</p>
        </footer>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="close-modal" id="closeModal"><i class="fas fa-times"></i></button>
            <h2 id="modalTitle"><i class="fas fa-sign-in-alt"></i> Вход</h2>
            <input type="text" id="modalUsername" placeholder="Имя пользователя">
            <input type="password" id="modalPassword" placeholder="Пароль">
            <button id="modalSubmit">Войти</button>
            <div class="switch" id="modalSwitch">Нет аккаунта? Зарегистрироваться</div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
