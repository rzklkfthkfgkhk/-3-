<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stas Anime</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a1a;
            color: #e8e8f0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }
        .wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px 30px;
        }

        .header {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 26px;
            font-weight: 900;
            cursor: pointer;
            color: #7c3aed;
        }
        .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .search {
            display: flex;
            gap: 4px;
            background: #14142a;
            border-radius: 30px;
            border: 2px solid #2a2a4a;
            padding: 2px 2px 2px 16px;
        }
        .search input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            padding: 8px 0;
            outline: none;
            width: 160px;
        }
        .search input:focus {
            width: 200px;
        }
        .search button {
            background: #7c3aed;
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
        }
        .auth-btns {
            display: flex;
            gap: 6px;
        }
        .auth-btns button {
            padding: 6px 14px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            background: transparent;
            color: #888;
            border: 1px solid #2a2a4a !important;
        }
        .auth-btns button:hover {
            border-color: #7c3aed !important;
            color: #fff;
        }
        #registerBtn {
            background: #7c3aed;
            color: #fff;
            border: none !important;
        }
        #registerBtn:hover {
            background: #6d28d9;
        }
        #logoutBtn {
            background: #dc2626;
            color: #fff;
            border: none !important;
        }
        #logoutBtn:hover {
            background: #b91c1c;
        }
        #profileBtn {
            background: #2a2a4a;
            color: #fff;
            border: none !important;
        }
        #profileBtn:hover {
            background: #3a3a5a;
        }
        .user-name {
            color: #7c3aed;
        }

        .nav {
            display: flex;
            gap: 4px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            border-bottom: 1px solid #1a1a36;
            padding-bottom: 10px;
        }
        .nav button {
            background: transparent;
            border: none;
            color: #666;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
        }
        .nav button:hover {
            color: #fff;
            background: #1a1a36;
        }
        .nav button.active {
            color: #fff;
            background: #2a2a4a;
            border: 1px solid #7c3aed;
        }
        .nav button .badge {
            background: #7c3aed;
            color: #fff;
            padding: 0px 6px;
            border-radius: 20px;
            font-size: 10px;
            margin-left: 2px;
        }

        .stats {
            display: flex;
            gap: 20px;
            padding: 6px 0;
            margin-bottom: 10px;
            color: #666;
            font-size: 13px;
            border-bottom: 1px solid #1a1a36;
        }
        .stats span:last-child {
            color: #e8e8f0;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 18px;
            min-height: 200px;
            margin-top: 10px;
        }

        .card {
            background: #14142a;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #1a1a36;
            transition: 0.3s;
            position: relative;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #7c3aed;
        }
        .card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
        }
        .card-body {
            padding: 10px 12px 12px;
        }
        .card-body h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-body .meta {
            font-size: 11px;
            color: #666;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 4px 0 6px;
        }
        .card-body .meta span {
            background: #1a1a36;
            padding: 2px 8px;
            border-radius: 20px;
        }
        .card-body .meta .score {
            color: #fbbf24;
        }
        .card-body .status-line {
            font-size: 12px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 6px;
            padding-top: 6px;
            border-top: 1px solid #1a1a36;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.green {
            background: #4ade80;
        }
        .status-dot.blue {
            background: #60a5fa;
        }
        .status-dot.gray {
            background: #555;
        }

        .card-actions {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 5;
        }
        .card-actions button {
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #888;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            backdrop-filter: blur(4px);
        }
        .card-actions button:hover {
            transform: scale(1.1);
        }
        .card-actions .fav-btn.active {
            color: #ef4444;
        }
        .card-actions .watched-btn.active {
            color: #60a5fa;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: #555;
        }
        .empty i {
            font-size: 40px;
            color: #1a1a36;
            display: block;
            margin-bottom: 10px;
        }
        .empty h3 {
            font-size: 18px;
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #1a1a36;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading p {
            color: #666;
            margin-top: 10px;
        }

        #player {
            margin-top: 20px;
            background: #14142a;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #1a1a36;
            animation: slideUp 0.3s ease;
        }
        #player.hidden {
            display: none;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .player-header h3 {
            font-size: 17px;
            font-weight: 600;
        }
        .player-header button {
            background: #1a1a36;
            border: none;
            color: #888;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
        }
        .player-header button:hover {
            background: #dc2626;
            color: #fff;
        }

        .player-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            padding: 6px 10px;
            background: #0a0a1a;
            border-radius: 10px;
            align-items: center;
        }
        .player-controls select {
            background: #1a1a36;
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }
        .player-controls .status {
            color: #7c3aed;
            font-size: 13px;
            flex: 1;
        }
        .player-controls button {
            background: #1a1a36;
            border: none;
            color: #888;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }
        .player-controls button:hover {
            background: #2a2a4a;
            color: #fff;
        }
        .player-controls .watch-btn.active {
            background: #60a5fa;
            color: #fff;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #0a0a1a;
            border-radius: 12px;
            overflow: hidden;
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .player-status {
            padding: 8px 14px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 13px;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }
        .player-status.error {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
            color: #f87171;
        }
        .player-status.success {
            background: rgba(52, 211, 153, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.15);
            color: #4ade80;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: #14142a;
            border-radius: 20px;
            padding: 28px 32px;
            max-width: 400px;
            width: 90%;
            border: 1px solid #2a2a4a;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .modal .close-modal {
            position: absolute;
            top: 10px;
            right: 14px;
            background: none;
            border: none;
            color: #666;
            font-size: 20px;
            cursor: pointer;
        }
        .modal .close-modal:hover {
            color: #fff;
        }
        .modal h2 {
            font-size: 22px;
            margin-bottom: 16px;
            text-align: center;
        }
        .modal input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 2px solid #2a2a4a;
            background: #0a0a1a;
            color: #fff;
            font-size: 14px;
            margin-bottom: 10px;
            outline: none;
        }
        .modal input:focus {
            border-color: #7c3aed;
        }
        .modal button {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: none;
            background: #7c3aed;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .modal button:hover {
            background: #6d28d9;
        }
        .modal .switch {
            text-align: center;
            margin-top: 12px;
            color: #666;
            font-size: 13px;
            cursor: pointer;
        }
        .modal .switch:hover {
            color: #7c3aed;
        }

        .profile-modal .profile-info {
            background: #0a0a1a;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 14px;
            border: 1px solid #1a1a36;
        }
        .profile-modal .profile-info p {
            margin: 3px 0;
            font-size: 14px;
            color: #888;
        }
        .profile-modal .profile-info p span {
            color: #e8e8f0;
            font-weight: 600;
        }
        .profile-modal .profile-list {
            max-height: 120px;
            overflow-y: auto;
            background: #0a0a1a;
            border-radius: 8px;
            padding: 6px 10px;
            border: 1px solid #1a1a36;
            margin-bottom: 10px;
        }
        .profile-modal .profile-list .list-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid #1a1a36;
            font-size: 13px;
            color: #888;
        }
        .profile-modal .profile-list .list-item:last-child {
            border-bottom: none;
        }
        .profile-modal .profile-list .list-item .title {
            color: #e8e8f0;
            cursor: pointer;
        }
        .profile-modal .profile-list .list-item .title:hover {
            color: #7c3aed;
        }
        .profile-modal .profile-list .list-item .remove {
            color: #dc2626;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a36;
            color: #e8e8f0;
            padding: 10px 24px;
            border-radius: 12px;
            border: 1px solid #2a2a4a;
            font-size: 14px;
            z-index: 2000;
            display: none;
            max-width: 90%;
        }
        .toast.show {
            display: block;
        }

        .footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px solid #1a1a36;
            text-align: center;
            color: #444;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-right {
                flex-direction: column;
                align-items: stretch;
            }
            .search input {
                width: 100%;
            }
            .search input:focus {
                width: 100%;
            }
            #grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
            .nav button {
                font-size: 11px;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="wrap">
        <header class="header">
            <div class="logo" id="logoLink">🎬 StasAnime</div>
            <div class="header-right">
                <div class="search">
                    <input type="text" id="searchInput" placeholder="Поиск аниме..." value="one piece">
                    <button id="searchBtn">🔍</button>
                </div>
                <div class="auth-btns" id="authBtns">
                    <button id="loginBtn">Вход</button>
                    <button id="registerBtn">Регистрация</button>
                </div>
                <div class="auth-btns" id="userInfo" style="display:none;">
                    <span class="user-name" id="userNameDisplay">👤 </span>
                    <button id="profileBtn">📋</button>
                    <button id="logoutBtn">🚪</button>
                </div>
            </div>
        </header>

        <nav class="nav" id="nav">
            <button class="active" data-tab="ongoing">🔄 Онгоинги</button>
            <button data-tab="top">🏆 Топ-100</button>
            <button data-tab="favorites">❤️ Избранное <span class="badge" id="favCount">0</span></button>
            <button data-tab="watched">👁️ Просмотренные <span class="badge" id="watchedCount">0</span></button>
            <button data-tab="search" id="searchTab">🔍 Поиск</button>
        </nav>

        <div class="stats">
            <span id="currentTabLabel">📺 Онгоинги</span>
            <span id="count">0 аниме</span>
        </div>

        <div id="grid"></div>

        <div id="player" class="hidden">
            <div class="player-header">
                <h3 id="playerTitle">🎬 Название</h3>
                <button id="closePlayer">✕</button>
            </div>
            <div class="player-controls">
                <select id="episodeSelect"></select>
                <span class="status" id="sourceStatus">⏳ Загрузка...</span>
                <button id="reloadBtn">🔄</button>
                <button id="watchBtn">👁️ Просмотрено</button>
            </div>
            <div class="player-wrapper">
                <iframe id="playerFrame" src="" allowfullscreen></iframe>
            </div>
            <div id="playerStatus" class="player-status">💡 Выберите аниме</div>
        </div>

        <footer class="footer">Stas Anime · AniList · Поиск VK/YouTube</footer>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="close-modal" id="closeModal">✕</button>
            <h2 id="modalTitle">🔐 Вход</h2>
            <input type="text" id="modalUsername" placeholder="Имя пользователя">
            <input type="password" id="modalPassword" placeholder="Пароль">
            <button id="modalSubmit">Войти</button>
            <div class="switch" id="modalSwitch">Нет аккаунта? Зарегистрироваться</div>
        </div>
    </div>

    <div class="modal-overlay" id="profileModal">
        <div class="modal profile-modal">
            <button class="close-modal" id="closeProfile">✕</button>
            <h2>👤 Профиль</h2>
            <div class="profile-info">
                <p>👤 <span id="profileUsername">Имя</span></p>
                <p>❤️ Избранное: <span id="profileFavCount">0</span></p>
                <p>👁️ Просмотренные: <span id="profileWatchedCount">0</span></p>
            </div>
            <h3>❤️ Избранное</h3>
            <div id="profileFavList" class="profile-list"></div>
            <h3>👁️ Просмотренные</h3>
            <div id="profileWatchedList" class="profile-list"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // STAS ANIME - ПОЛНАЯ ВЕРСИЯ
        // ============================================================

        (function() {
            'use strict';

            // ===== DOM =====
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const grid = document.getElementById('grid');
            const count = document.getElementById('count');
            const currentTabLabel = document.getElementById('currentTabLabel');
            const logo = document.getElementById('logoLink');
            const nav = document.getElementById('nav');
            const favCount = document.getElementById('favCount');
            const watchedCount = document.getElementById('watchedCount');
            const searchTab = document.getElementById('searchTab');

            const player = document.getElementById('player');
            const playerTitle = document.getElementById('playerTitle');
            const playerFrame = document.getElementById('playerFrame');
            const closePlayer = document.getElementById('closePlayer');
            const episodeSelect = document.getElementById('episodeSelect');
            const sourceStatus = document.getElementById('sourceStatus');
            const reloadBtn = document.getElementById('reloadBtn');
            const watchBtn = document.getElementById('watchBtn');
            const playerStatus = document.getElementById('playerStatus');

            const modalOverlay = document.getElementById('modalOverlay');
            const closeModal = document.getElementById('closeModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalUsername = document.getElementById('modalUsername');
            const modalPassword = document.getElementById('modalPassword');
            const modalSubmit = document.getElementById('modalSubmit');
            const modalSwitch = document.getElementById('modalSwitch');

            const profileModal = document.getElementById('profileModal');
            const closeProfile = document.getElementById('closeProfile');
            const profileUsername = document.getElementById('profileUsername');
            const profileFavCount = document.getElementById('profileFavCount');
            const profileWatchedCount = document.getElementById('profileWatchedCount');
            const profileFavList = document.getElementById('profileFavList');
            const profileWatchedList = document.getElementById('profileWatchedList');

            const loginBtn = document.getElementById('loginBtn');
            const registerBtn = document.getElementById('registerBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const profileBtn = document.getElementById('profileBtn');
            const authBtns = document.getElementById('authBtns');
            const userInfo = document.getElementById('userInfo');
            const userNameDisplay = document.getElementById('userNameDisplay');
            const toast = document.getElementById('toast');

            // ===== STATE =====
            let currentTab = 'ongoing';
            let currentResults = [];
            let isLoading = false;
            let currentAnime = null;
            let isLoginMode = true;

            // ===== AUTH =====
            let currentUser = JSON.parse(localStorage.getItem('animeUser') || 'null');

            function updateAuthUI() {
                if (currentUser) {
                    authBtns.style.display = 'none';
                    userInfo.style.display = 'flex';
                    userNameDisplay.textContent = '👤 ' + currentUser.username;
                    updateBadges();
                } else {
                    authBtns.style.display = 'flex';
                    userInfo.style.display = 'none';
                }
            }

            function getFavorites() {
                if (!currentUser) return [];
                return currentUser.favorites || [];
            }

            function getWatched() {
                if (!currentUser) return [];
                return currentUser.watched || [];
            }

            function updateBadges() {
                favCount.textContent = getFavorites().length;
                watchedCount.textContent = getWatched().length;
            }

            function saveUserData() {
                if (currentUser) {
                    localStorage.setItem('animeUser', JSON.stringify(currentUser));
                    updateBadges();
                }
            }

            function toggleFavorite(id) {
                if (!currentUser) {
                    showToast('⚠️ Войдите в аккаунт');
                    return;
                }
                let favs = getFavorites();
                const idx = favs.indexOf(id);
                if (idx > -1) {
                    favs.splice(idx, 1);
                    showToast('💔 Убрано');
                } else {
                    favs.push(id);
                    showToast('❤️ Добавлено');
                }
                currentUser.favorites = favs;
                saveUserData();
                renderCurrentView();
                updateWatchBtn();
            }

            function toggleWatched(id) {
                if (!currentUser) {
                    showToast('⚠️ Войдите в аккаунт');
                    return;
                }
                let watched = getWatched();
                const idx = watched.indexOf(id);
                if (idx > -1) {
                    watched.splice(idx, 1);
                    showToast('👁️ Убрано');
                } else {
                    watched.push(id);
                    showToast('👁️ Добавлено');
                }
                currentUser.watched = watched;
                saveUserData();
                renderCurrentView();
                updateWatchBtn();
            }

            function isFavorite(id) {
                return getFavorites().includes(id);
            }

            function isWatched(id) {
                return getWatched().includes(id);
            }

            function updateWatchBtn() {
                if (currentAnime && watchBtn) {
                    const id = currentAnime.id;
                    if (isWatched(id)) {
                        watchBtn.textContent = '✅ Просмотрено';
                        watchBtn.classList.add('active');
                    } else {
                        watchBtn.textContent = '👁️ Просмотрено';
                        watchBtn.classList.remove('active');
                    }
                }
            }

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
            }

            // ===== MODAL =====
            function openModal(mode) {
                isLoginMode = mode === 'login';
                modalTitle.textContent = isLoginMode ? '🔐 Вход' : '📝 Регистрация';
                modalSubmit.textContent = isLoginMode ? 'Войти' : 'Зарегистрироваться';
                modalSwitch.textContent = isLoginMode ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
                modalUsername.value = '';
                modalPassword.value = '';
                modalOverlay.classList.add('show');
            }

            function closeModalFn() {
                modalOverlay.classList.remove('show');
            }

            function handleAuth() {
                const username = modalUsername.value.trim();
                const password = modalPassword.value.trim();
                if (!username || !password) {
                    showToast('⚠️ Заполните все поля');
                    return;
                }
                let users = JSON.parse(localStorage.getItem('animeUsers') || '[]');

                if (isLoginMode) {
                    const user = users.find(u => u.username === username && u.password === password);
                    if (user) {
                        currentUser = { username: user.username, favorites: user.favorites || [], watched: user.watched ||
                            [] };
                        localStorage.setItem('animeUser', JSON.stringify(currentUser));
                        updateAuthUI();
                        closeModalFn();
                        showToast(`✅ Добро пожаловать, ${username}!`);
                        renderCurrentView();
                        return;
                    }
                    showToast('❌ Неверное имя или пароль');
                } else {
                    if (users.find(u => u.username === username)) {
                        showToast('❌ Пользователь уже существует');
                        return;
                    }
                    users.push({ username, password, favorites: [], watched: [] });
                    localStorage.setItem('animeUsers', JSON.stringify(users));
                    currentUser = { username, favorites: [], watched: [] };
                    localStorage.setItem('animeUser', JSON.stringify(currentUser));
                    updateAuthUI();
                    closeModalFn();
                    showToast(`✅ Аккаунт создан! Добро пожаловать, ${username}!`);
                    renderCurrentView();
                }
            }

            function logout() {
                currentUser = null;
                localStorage.removeItem('animeUser');
                updateAuthUI();
                showToast('👋 Вы вышли');
                renderCurrentView();
            }

            // ===== PROFILE =====
            function openProfile() {
                if (!currentUser) {
                    showToast('⚠️ Войдите в аккаунт');
                    return;
                }
                profileUsername.textContent = currentUser.username;
                const favs = getFavorites();
                const watched = getWatched();
                profileFavCount.textContent = favs.length;
                profileWatchedCount.textContent = watched.length;

                profileFavList.innerHTML = '';
                if (favs.length === 0) {
                    profileFavList.innerHTML = '<div class="list-item" style="color:#555;">Нет избранных</div>';
                } else {
                    favs.forEach(id => {
                        const anime = currentResults.find(a => a.id === id);
                        const name = anime ? (anime.title?.romaji || anime.title?.english || 'Без названия') :
                            `ID: ${id}`;
                        const div = document.createElement('div');
                        div.className = 'list-item';
                        div.innerHTML =
                            `<span class="title" data-id="${id}">${name}</span><span class="remove" data-id="${id}">✕</span>`;
                        div.querySelector('.title').addEventListener('click', () => {
                            const a = currentResults.find(an => an.id === id);
                            if (a) openPlayer(a, name);
                            profileModal.classList.remove('show');

                        div.querySelector('.remove').addEventListener('click', (e) => {
                            e.stopPropagation();
                            toggleFavorite(id);

                }

                profileWatchedList.innerHTML = '';
                if (watched.length === 0) {
                    profileWatchedList.innerHTML = '<div class="list-item" style="color:#555;">Нет просмотренных</div>';
                } else {
                    watched.forEach(id => {
                        const anime = currentResults.find(a => a.id === id);
                        const name = anime ? (anime.title?.romaji || anime.title?.english || 'Без названия') :
                            `ID: ${id}`;
                        const div = document.createElement('div');
                        div.className = 'list-item';
                        div.innerHTML =
                            `<span class="title" data-id="${id}">${name}</span><span class="remove" data-id="${id}">✕</span>`;
                        div.querySelector('.title').addEventListener('click', () => {
                            const a = currentResults.find(an => an.id === id);
                            if (a) openPlayer(a, name);
                            profileModal.classList.remove('show');

                        div.querySelector('.remove').addEventListener('click', (e) => {
                            e.stopPropagation();
                            toggleWatched(id);
                            openProfile();

                        profileWatchedList.appendChild(div);

            function closeProfileFn() {

            // ===== ANILIST QUERY =====
            const ANILIST_QUERY = `
                    query ($page: Int, $perPage: Int, $search: String, $sort: [MediaSort], $status: MediaStatus) {
                        Page(page: $page, perPage: $perPage) {
                            media(search: $search, sort: $sort, status: $status, type: ANIME) {

            // ===== ПОИСК ВИДЕО =====
            async function searchVideos(query, episode) {
                const searchQuery = `${query} ${episode} серия аниме`;
                try {
                    // VK
                    const vkUrl =
                        `https://api.vk.com/method/video.search?q=${encodeURIComponent(searchQuery)}&count=5&sort=2&v=5.131`;
                    const vkRes = await fetch(vkUrl);
                    const vkData = await vkRes.json();
                    if (vkData.response && vkData.response.items && vkData.response.items.length > 0) {
                        const item = vkData.response.items[0];
                        return `https://vk.com/video_ext.php?oid=${item.owner_id}&id=${item.id}&hash=${item.access_key || ''}`;
                    }

                    // YouTube
                    const ytRes = await fetch(
                        `https://www.youtube.com/results?search_query=${encodeURIComponent(searchQuery)}`);
                    const ytHtml = await ytRes.text();
                    const regex = /"videoId":"([^"]+)"/;
                    const match = regex.exec(ytHtml);
                    if (match) {
                        return `https://www.youtube.com/embed/${match[1]}?autoplay=1&rel=0`;
                    }

                    return null;
                } catch (error) {
                    console.error('Ошибка поиска видео:', error);
                    return null;
                }
            }

            // ===== OPEN PLAYER =====
            async function openPlayer(anime, title) {
                currentAnime = anime;
                const animeTitle = title || anime.title?.romaji || anime.title?.english || 'Аниме';

                player.classList.remove('hidden');
                playerTitle.textContent = '🎬 ' + animeTitle;

                const total = anime.episodes || 12;
                episodeSelect.innerHTML = '';
                for (let i = 1; i <= Math.min(total, 50); i++) {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = `Серия ${i}`;
                    episodeSelect.appendChild(opt);
                }

                updateWatchBtn();

                const ep = parseInt(episodeSelect.value) || 1;
                sourceStatus.textContent = '🔍 Поиск видео...';
                playerStatus.textContent = '⏳ Ищем видео...';
                playerStatus.className = 'player-status';

                try {
                    const videoUrl = await searchVideos(animeTitle, ep);
                    if (videoUrl) {
                        playerFrame.src = videoUrl;
                        sourceStatus.textContent = '✅ Видео найдено!';
                        playerStatus.textContent = '▶️ Воспроизведение...';
                        playerStatus.className = 'player-status success';
                    } else {
                        sourceStatus.textContent = '❌ Видео не найдено';
                        playerStatus.textContent = '❌ Видео не найдено. Попробуйте другую серию.';
                        playerStatus.className = 'player-status error';
                        playerFrame.src = '';
                    }
                } catch (error) {
                    sourceStatus.textContent = '❌ Ошибка';
                    playerStatus.textContent = '⚠️ Ошибка поиска видео';
                    playerStatus.className = 'player-status error';
                }

                setTimeout(() => {
                    player.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            }

            async function changeEpisode() {
                if (currentAnime) {
                    const title = currentAnime.title?.romaji || currentAnime.title?.english || 'Аниме';
                    await openPlayer(currentAnime, title);
                }
            }

            async function reloadPlayer() {
                if (currentAnime) {
                    const title = currentAnime.title?.romaji || currentAnime.title?.english || 'Аниме';
                    await openPlayer(currentAnime, title);
                }
            }

            function closePlayerFn() {
                player.classList.add('hidden');
                playerFrame.src = '';
                currentAnime = null;
                playerStatus.textContent = '💡 Выберите аниме';
                playerStatus.className = 'player-status';
            }

            // ===== RENDER CARDS =====
            function renderCards(list) {
                if (!list || list.length === 0) {
                    grid.innerHTML = `
                            <div class="empty">
                                <i class="fas fa-inbox"></i>
                                <h3>Ничего не найдено</h3>
                                <button onclick="loadFallback()" style="margin-top:12px;padding:8px 20px;border-radius:20px;border:none;background:#7c3aed;color:#fff;cursor:pointer;">📺 Показать примеры</button>
                            </div>
                        `;
                    return;
                }

                let html = '';
                for (const anime of list) {
                    const title = anime.title?.romaji || anime.title?.english || anime.title?.native || 'Без названия';
                    const cover = anime.coverImage?.extraLarge || anime.coverImage?.large || '';
                    const genres = (anime.genres || []).slice(0, 2).join(' · ');
                    const score = anime.averageScore ? Math.round(anime.averageScore / 10) : '—';
                    const episodes = anime.episodes || '?';
                    const status = anime.status || 'UNKNOWN';
                    const statusLabel = status === 'RELEASING' ? '🟢 Выходит' : status === 'FINISHED' ? '🔵 Завершён' :
                        '⚪ Скоро';
                    const dotClass = status === 'RELEASING' ? 'green' : status === 'FINISHED' ? 'blue' : 'gray';
                    const fav = isFavorite(anime.id);
                    const watched = isWatched(anime.id);

                    html += `
                            <div class="card" data-id="${anime.id}" data-title="${encodeURIComponent(title)}">
                                <div class="card-actions">
                                    <button class="fav-btn ${fav ? 'active' : ''}" data-id="${anime.id}">${fav ? '❤️' : '🤍'}</button>
                                    <button class="watched-btn ${watched ? 'active' : ''}" data-id="${anime.id}">${watched ? '👁️' : '👁️'}</button>
                                </div>
                                <img src="${cover}" alt="${title}" loading="lazy"
                                     onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22450%22%3E%3Crect fill=%22%2314142a%22 width=%22300%22 height=%22450%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 font-size=%2220%22 fill=%22%23555%22 text-anchor=%22middle%22 dominant-baseline=%22central%22%3ENo Image%3C/text%3E%3C/svg%3E'" />
                                <div class="card-body">
                                    <h3>${escapeHtml(title)}</h3>
                                    ${genres ? `<div class="genres">${escapeHtml(genres)}</div>` : ''}
                                    <div class="meta">
                                        <span>${anime.format || 'TV'}</span>
                                        <span class="score">⭐ ${score}</span>
                                        <span>${episodes} эп.</span>
                                        ${anime.seasonYear ? `<span>${anime.seasonYear}</span>` : ''}
                                    </div>
                                    <div class="status-line">
                                        <span class="status-dot ${dotClass}"></span>
                                        ${statusLabel}
                                    </div>
                                </div>
                            </div>
                        `;
                }
                grid.innerHTML = html;

                document.querySelectorAll('.card').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.closest('.card-actions')) return;
                        const id = parseInt(this.dataset.id);
                        const title = decodeURIComponent(this.dataset.title);
                        const anime = currentResults.find(a => a.id === id);
                        if (anime) openPlayer(anime, title);
                    });
                });

                document.querySelectorAll('.fav-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        toggleFavorite(id);
                        this.classList.toggle('active');
                        this.textContent = this.classList.contains('active') ? '❤️' : '🤍';
                    });
                });

                document.querySelectorAll('.watched-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        toggleWatched(id);
                        this.classList.toggle('active');
                    });
                });
            }

            // ===== LOAD ANIME =====
            async function loadAnime(tab, search = '') {
                if (isLoading) return;
                isLoading = true;
                grid.innerHTML = `<div class="loading"><div class="spinner"></div><p>Загрузка...</p></div>`;

                try {
                    let variables = { page: 1, perPage: 30 };
                    let label = '';

                    if (tab === 'ongoing') {
                        variables.status = 'RELEASING';
                        variables.sort = ['POPULARITY_DESC'];
                        label = '📺 Онгоинги';
                    } else if (tab === 'top') {
                        variables.sort = ['SCORE_DESC'];
                        label = '🏆 Топ-100';
                    } else if (tab === 'favorites') {
                        const favs = getFavorites();
                        if (favs.length === 0) {
                            grid.innerHTML =
                                `<div class="empty"><i class="fas fa-heart"></i><h3>Нет избранных</h3><p>Добавьте аниме в избранное ❤️</p></div>`;
                            count.textContent = '0 избранных';
                            currentTabLabel.textContent = '❤️ Избранное';
                            isLoading = false;
                            return;
                        }
                        const res = await fetch('https://graphql.anilist.co', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                query: `
                                        query ($ids: [Int]) {
                                            Page(page: 1, perPage: 50) {
                                                media(id_in: $ids, type: ANIME, sort: [POPULARITY_DESC]) {
                                                    id
                                                    title { romaji english native }
                                                    coverImage { large extraLarge }
                                                    format
                                                    episodes
                                                    status
                                                    averageScore
                                                    genres
                                                    seasonYear
                                                }
                                            }
                                        }
                                    `,
                                variables: { ids: favs }
                            })
                        });
                        const json = await res.json();
                        const media = json?.data?.Page?.media || [];
                        currentResults = media;
                        renderCards(media);
                        count.textContent = media.length + ' избранных';
                        currentTabLabel.textContent = '❤️ Избранное';
                        isLoading = false;
                        return;
                    } else if (tab === 'watched') {
                        const watchedList = getWatched();
                        if (watchedList.length === 0) {
                            grid.innerHTML =
                                `<div class="empty"><i class="fas fa-eye"></i><h3>Нет просмотренных</h3><p>Добавьте аниме в просмотренные 👁️</p></div>`;
                            count.textContent = '0 просмотренных';
                            currentTabLabel.textContent = '👁️ Просмотренные';
                            isLoading = false;
                            return;
                        }
                        const res = await fetch('https://graphql.anilist.co', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                query: `
                                        query ($ids: [Int]) {
                                            Page(page: 1, perPage: 50) {
                                                media(id_in: $ids, type: ANIME, sort: [POPULARITY_DESC]) {
                                                    id
                                                    title { romaji english native }
                                                    coverImage { large extraLarge }
                                                    format
                                                    episodes
                                                    status
                                                    averageScore
                                                    genres
                                                    seasonYear
                                                }
                                            }
                                        }
                                    `,
                                variables: { ids: watchedList }
                            })
                        });
                        const json = await res.json();
                        const media = json?.data?.Page?.media || [];
                        currentResults = media;
                        renderCards(media);
                        count.textContent = media.length + ' просмотренных';
                        currentTabLabel.textContent = '👁️ Просмотренные';
                        isLoading = false;
                        return;
                    } else if (tab === 'search' && search) {
                        variables.search = search;
                        variables.sort = ['POPULARITY_DESC'];
                        label = `🔍 Результаты: "${search}"`;
                    } else {
                        isLoading = false;
                        return;
                    }

                    const res = await fetch('https://graphql.anilist.co', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query: ANILIST_QUERY, variables })
                    });

                    if (!res.ok) throw new Error(`HTTP ${res.status}`);

                    const json = await res.json();
                    if (json.errors) {
                        throw new Error(json.errors[0]?.message || 'Ошибка GraphQL');
                    }

                    const media = json?.data?.Page?.media || [];
                    currentResults = media;

                    if (media.length === 0) {
                        grid.innerHTML = `
                                <div class="empty">
                                    <i class="fas fa-inbox"></i>
                                    <h3>Ничего не найдено</h3>
                                    <button onclick="loadFallback()" style="margin-top:12px;padding:8px 20px;border-radius:20px;border:none;background:#7c3aed;color:#fff;cursor:pointer;">📺 Показать примеры</button>
                                </div>
                            `;
                        count.textContent = '0';
                        currentTabLabel.textContent = label || '📺 Онгоинги';
                        isLoading = false;
                        return;
                    }

                    renderCards(media);
                    count.textContent = media.length + ' аниме';
                    currentTabLabel.textContent = label || '📺 Онгоинги';

                } catch (err) {
                    console.error('Ошибка:', err);
                    grid.innerHTML = `
                            <div class="empty">
                                <i class="fas fa-exclamation-triangle"></i>
                                <h3>Ошибка загрузки</h3>
                                <p>${err.message}</p>
                                <button onclick="loadFallback()" style="margin-top:12px;padding:8px 20px;border-radius:20px;border:none;background:#7c3aed;color:#fff;cursor:pointer;">📺 Показать примеры</button>
                            </div>
                        `;
                    count.textContent = '⚠️ Ошибка';
                } finally {
                    isLoading = false;
                }
            }

            loginBtn.addEventListener('click', () => openModal('login'));
            registerBtn.addEventListener('click', () => openModal('register'));
            logoutBtn.addEventListener('click', logout);
            profileBtn.addEventListener('click', openProfile);

            closeProfile.addEventListener('click', closeProfileFn);

            profileModal.addEventListener('click', function(e) {

                if (e.key === 'Enter') modalPassword.focus();

                if (e.key === 'Enter') handleAuth();

            // ===== LOGO =====
            logo.addEventListener('click', function() {
                closePlayerFn();
                currentTab = 'ongoing';
                document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
                document.querySelector('[data-tab="ongoing"]')?.classList.add('active');
                loadAnime('ongoing');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // ===== ESC =====
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (!player.classList.contains('hidden')) closePlayerFn();
                    if (modalOverlay.classList.contains('show')) closeModalFn();
                    if (profileModal.classList.contains('show')) closeProfileFn();
                }
            });

            // ===== INIT =====
            updateAuthUI();
            updateBadges();
            setTimeout(() => {
                loadAnime('ongoing');
            }, 300);
            setTimeout(() => {
                if (currentResults.length === 0) loadFallback();
            }, 4000);

        })();
    </script>

</body>
</html>
