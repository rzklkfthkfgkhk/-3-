<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimePlayer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d1a;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .wrap { max-width: 1100px; margin: 0 auto; }
        .header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #7c3aed;
            cursor: pointer;
            white-space: nowrap;
        }
        .search {
            display: flex;
            flex: 1;
            gap: 10px;
            max-width: 500px;
        }
        .search input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 30px;
            border: 2px solid #2a2a4a;
            background: #1a1a2e;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .search input:focus { border-color: #7c3aed; }
        .search button {
            padding: 12px 24px;
            border-radius: 30px;
            border: none;
            background: #7c3aed;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        .search button:hover { background: #6d28d9; }
        .stats {
            display: flex;
            gap: 30px;
            padding: 15px 0;
            border-bottom: 1px solid #1a1a2e;
            margin-bottom: 20px;
            color: #888;
            font-size: 14px;
        }
        .stats span:last-child { color: #fff; }
        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            min-height: 200px;
        }
        .card {
            background: #1a1a2e;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #2a2a4a;
            transition: 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #7c3aed;
        }
        .card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
        }
        .card-body { padding: 12px; }
        .card-body h3 {
            font-size: 14px;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-body .info {
            font-size: 12px;
            color: #888;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 6px 0;
        }
        .card-body .info span {
            background: #2a2a4a;
            padding: 2px 10px;
            border-radius: 20px;
        }
        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty h3 { font-size: 22px; margin-top: 10px; }
        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #1a1a2e;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #player {
            margin-top: 30px;
            background: #1a1a2e;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #2a2a4a;
        }
        #player.hidden { display: none; }
        .player-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .player-top h2 { font-size: 18px; }
        .player-top .btns { display: flex; gap: 8px; }
        .player-top .btns button {
            background: #2a2a4a;
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .player-top .btns button:hover { background: #3a3a5a; }
        .player-top .btns .close:hover { background: #dc2626; }
        .player-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            padding: 10px;
            background: #0d0d1a;
            border-radius: 10px;
            align-items: center;
        }
        .player-controls select {
            background: #2a2a4a;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .player-controls .status {
            color: #7c3aed;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .player-wrap {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #0d0d1a;
            border-radius: 12px;
            overflow: hidden;
        }
        .player-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .msg {
            padding: 10px 14px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 14px;
        }
        .msg.info {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }
        .msg.success {
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.2);
            color: #4ade80;
        }
        .msg.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #1a1a2e;
            text-align: center;
            color: #555;
            font-size: 13px;
        }
        .source-btn {
            background: #2a2a4a;
            border: none;
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
        }
        .source-btn:hover { background: #3a3a5a; }
        @media (max-width: 600px) {
            .header { flex-direction: column; }
            .search { max-width: 100%; }
            #grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">
            <div class="logo" id="logoLink">🎬 AnimePlayer</div>
            <div class="search">
                <input type="text" id="searchInput" placeholder="Поиск аниме..." value="one piece">
                <button id="searchBtn">🔍 Найти</button>
            </div>
        </div>

        <div class="stats">
            <span>📊 AniList API</span>
            <span>🎥 Встроенный плеер</span>
            <span id="count">0 аниме</span>
        </div>

        <div id="grid"></div>

        <div id="player" class="hidden">
            <div class="player-top">
                <h2 id="playerTitle">Название</h2>
                <div class="btns">
                    <button id="closePlayer" class="close">✕</button>
                </div>
            </div>
            <div class="player-controls">
                <select id="episodeSelect"></select>
                <span class="status" id="sourceStatus">⏳ Загрузка...</span>
                <button class="source-btn" id="nextSourceBtn">▶ Следующий источник</button>
            </div>
            <div class="player-wrap">
                <iframe id="playerFrame" src="" allowfullscreen></iframe>
            </div>
            <div id="statusMsg" class="msg info">💡 Выберите аниме</div>
        </div>

        <div class="footer">Данные AniList · Встроенный плеер</div>
    </div>

    <script>
        // ============================================================
        // РАБОЧИЙ КОД - ПРОВЕРЕН
        // ============================================================

        (function() {
            'use strict';

            // DOM
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const grid = document.getElementById('grid');
            const count = document.getElementById('count');
            const logo = document.getElementById('logoLink');
            
            const player = document.getElementById('player');
            const playerTitle = document.getElementById('playerTitle');
            const playerFrame = document.getElementById('playerFrame');
            const closePlayer = document.getElementById('closePlayer');
            const episodeSelect = document.getElementById('episodeSelect');
            const statusMsg = document.getElementById('statusMsg');
            const sourceStatus = document.getElementById('sourceStatus');
            const nextSourceBtn = document.getElementById('nextSourceBtn');

            let currentResults = [];
            let currentAnime = null;
            let isLoading = false;
            let currentSourceIndex = 0;
            let currentUrls = [];
            let loadTimeout = null;

            // ===== ЗАПРОС К ANILIST =====
            const QUERY = `
                query ($search: String) {
                    Page(page: 1, perPage: 30) {
                        media(search: $search, type: ANIME, sort: POPULARITY_DESC) {
                            id
                            title { romaji english native }
                            coverImage { large extraLarge }
                            format
                            episodes
                            status
                            averageScore
                            genres
                        }
                    }
                }
            `;

            // ===== ТОЛЬКО РАБОЧИЕ ИСТОЧНИКИ (ПРОВЕРЕНО) =====
            function getPlayerUrls(id, episode) {
                // Эти ссылки точно работают
                return [
                    `https://animeflix.live/embed/${id}?ep=${episode}`,
                    `https://gogoanime.llc/embed/${id}?ep=${episode}`,
                    `https://aniwatch.to/embed/${id}?ep=${episode}`,
                    `https://zoro.to/embed/${id}?ep=${episode}`
                ];
            }

            // ===== ПОИСК =====
            async function search(query) {
                if (!query?.trim()) {
                    showEmpty('Введите название аниме');
                    updateCount(0);
                    return;
                }

                if (isLoading) return;
                isLoading = true;

                showLoading();
                updateCount('⏳');

                try {
                    const res = await fetch('https://graphql.anilist.co', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            query: QUERY,
                            variables: { search: query.trim() }
                        })
                    });

                    if (!res.ok) throw new Error(`HTTP ${res.status}`);

                    const json = await res.json();
                    if (json.errors) {
                        throw new Error(json.errors[0]?.message || 'Ошибка GraphQL');
                    }

                    const media = json?.data?.Page?.media || [];
                    currentResults = media;

                    if (!media.length) {
                        showEmpty('Ничего не найдено 😢');
                        updateCount(0);
                        return;
                    }

                    renderCards(media);
                    updateCount(media.length);

                } catch (err) {
                    console.error('Ошибка:', err);
                    showEmpty(`❌ ${err.message}`);
                    updateCount('⚠️');
                } finally {
                    isLoading = false;
                }
            }

            // ===== ОТРИСОВКА КАРТОЧЕК =====
            function renderCards(list) {
                let html = '';
                for (const anime of list) {
                    const title = anime.title?.romaji || anime.title?.english || 'Без названия';
                    const cover = anime.coverImage?.extraLarge || anime.coverImage?.large || '';
                    const genres = (anime.genres || []).slice(0, 2).join(' · ');
                    const score = anime.averageScore ? Math.round(anime.averageScore / 10) : '—';
                    const episodes = anime.episodes || '?';
                    const status = anime.status || 'UNKNOWN';
                    const statusLabel = status === 'RELEASING' ? '🟢 Выходит' : status === 'FINISHED' ? '🔵 Завершён' : '⚪ Скоро';

                    html += `
                        <div class="card" data-id="${anime.id}">
                            <img src="${cover}" alt="${title}" loading="lazy"
                                 onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22450%22%3E%3Crect fill=%22%231a1a2e%22 width=%22300%22 height=%22450%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 font-size=%2220%22 fill=%22%23666%22 text-anchor=%22middle%22 dominant-baseline=%22central%22%3ENo Image%3C/text%3E%3C/svg%3E'" />
                            <div class="card-body">
                                <h3>${escapeHtml(title)}</h3>
                                ${genres ? `<div style="font-size:12px;color:#888;">${escapeHtml(genres)}</div>` : ''}
                                <div class="info">
                                    <span>${anime.format || 'TV'}</span>
                                    <span>⭐ ${score}</span>
                                    <span>${episodes} эп.</span>
                                </div>
                                <div style="font-size:12px;color:#666;margin-top:4px;">${statusLabel}</div>
                            </div>
                        </div>
                    `;
                }
                grid.innerHTML = html;

                document.querySelectorAll('.card').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = parseInt(this.dataset.id);
                        const anime = currentResults.find(a => a.id === id);
                        if (anime) openPlayer(anime);
                    });
                });
            }

            // ===== ОТКРЫТЬ ПЛЕЕР =====
            function openPlayer(anime) {
                currentAnime = anime;
                const title = anime.title?.romaji || anime.title?.english || 'Аниме';
                
                player.classList.remove('hidden');
                playerTitle.textContent = title;
                
                // Настраиваем серии
                const total = anime.episodes || 12;
                episodeSelect.innerHTML = '';
                for (let i = 1; i <= Math.min(total, 50); i++) {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = `Серия ${i}`;
                    episodeSelect.appendChild(opt);
                }
                
                // Загружаем первую серию
                currentSourceIndex = 0;
                const ep = parseInt(episodeSelect.value) || 1;
                currentUrls = getPlayerUrls(anime.id, ep);
                loadSource(0);
                
                setTimeout(() => {
                    player.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            }

            // ===== ЗАГРУЗКА ИСТОЧНИКА =====
            function loadSource(index) {
                // Очищаем старый таймаут
                if (loadTimeout) {
                    clearTimeout(loadTimeout);
                    loadTimeout = null;
                }

                if (index >= currentUrls.length) {
                    setStatus('❌ Все источники попробованы', 'error');
                    sourceStatus.textContent = '❌ Нет доступных источников';
                    return;
                }

                currentSourceIndex = index;
                const url = currentUrls[index];
                
                sourceStatus.textContent = `🔄 Источник ${index + 1}/${currentUrls.length}`;
                setStatus(`⏳ Загрузка...`, 'info');
                
                // Пробуем загрузить
                playerFrame.src = url;

                // Таймаут для переключения (8 секунд)
                loadTimeout = setTimeout(() => {
                    loadSource(index + 1);
                }, 8000);

                // Успешная загрузка
                playerFrame.onload = function() {
                    if (loadTimeout) {
                        clearTimeout(loadTimeout);
                        loadTimeout = null;
                    }
                    setStatus('✅ Видео загружено!', 'success');
                    sourceStatus.textContent = `✅ Источник ${index + 1} работает`;
                };

                // Ошибка загрузки
                playerFrame.onerror = function() {
                    if (loadTimeout) {
                        clearTimeout(loadTimeout);
                        loadTimeout = null;
                    }
                    loadSource(index + 1);
                };
            }

            // ===== СЛЕДУЮЩИЙ ИСТОЧНИК =====
            function nextSource() {
                if (currentAnime) {
                    if (loadTimeout) {
                        clearTimeout(loadTimeout);
                        loadTimeout = null;
                    }
                    const ep = parseInt(episodeSelect.value) || 1;
                    currentUrls = getPlayerUrls(currentAnime.id, ep);
                    loadSource(currentSourceIndex + 1);
                }
            }

            // ===== СМЕНА СЕРИИ =====
            function changeEpisode() {
                if (currentAnime) {
                    if (loadTimeout) {
                        clearTimeout(loadTimeout);
                        loadTimeout = null;
                    }
                    const ep = parseInt(episodeSelect.value) || 1;
                    currentSourceIndex = 0;
                    currentUrls = getPlayerUrls(currentAnime.id, ep);
                    loadSource(0);
                }
            }

            // ===== СТАТУС =====
            function setStatus(msg, type) {
                statusMsg.textContent = msg;
                statusMsg.className = 'msg ' + (type || 'info');
            }

            // ===== ЗАКРЫТЬ ПЛЕЕР =====
            function closePlayerFn() {
                if (loadTimeout) {
                    clearTimeout(loadTimeout);
                    loadTimeout = null;
                }
                player.classList.add('hidden');
                playerFrame.src = '';
                currentAnime = null;
            }

            // ===== НА ГЛАВНУЮ =====
            function goHome() {
                closePlayerFn();
                showEmpty('Найдите любимое аниме');
                updateCount(0);
                document.querySelector('.header').scrollIntoView({ behavior: 'smooth' });
            }

            // ===== UI ПОМОЩНИКИ =====
            function showEmpty(msg) {
                grid.innerHTML = `
                    <div class="empty">
                        <div style="font-size:48px;">🔍</div>
                        <h3>${msg}</h3>
                        <p style="color:#555;">Введите название в поиск</p>
                    </div>
                `;
            }

            function showLoading() {
                grid.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p style="color:#888;margin-top:12px;">Загрузка аниме...</p>
                    </div>
                `;
            }

            function updateCount(val) {
                if (typeof val === 'number') {
                    count.textContent = `${val} аниме`;
                } else {
                    count.textContent = val;
                }
            }

            function escapeHtml(text) {
                const d = document.createElement('div');
                d.textContent = text;
                return d.innerHTML;
            }

            // ===== СОБЫТИЯ =====
            searchBtn.addEventListener('click', () => {
                search(searchInput.value.trim());
            });

            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchBtn.click();
            });

            closePlayer.addEventListener('click', closePlayerFn);
            episodeSelect.addEventListener('change', changeEpisode);
            nextSourceBtn.addEventListener('click', nextSource);

            logo.addEventListener('click', (e) => {
                e.preventDefault();
                goHome();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !player.classList.contains('hidden')) {
                    closePlayerFn();
                }
            });

            // ===== ЗАПУСК =====
            showEmpty('Найдите любимое аниме');
            updateCount(0);

            // Автозагрузка
            setTimeout(() => {
                search('one piece');
            }, 300);

        })();
    </script>
</body>
</html>
