<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AniList-like Anime Hub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo">AnimeHub</div>
    <nav class="nav">
      <button id="btnHome" class="link-btn">Главная</button>
      <button id="btnProfile" class="link-btn">Профиль</button>
      <button id="btnLogout" class="link-btn" style="display:none;">Выйти</button>
      <button id="btnTheme" class="link-btn" title="Сменить тему">☀️</button>
    </nav>
  </header>

  <main class="container">
    <!-- AUTH: регистрация/вход -->
    <section id="authSection" class="card auth">
      <h2>Вход или регистрация</h2>
      <div class="auth-forms">
        <form id="loginForm" class="form">
          <h3>Вход</h3>
          <label>Имя пользователя
            <input type="text" id="loginUsername" required />
          </label>
          <label>Пароль
            <input type="password" id="loginPassword" required />
          </label>
          <button type="submit">Войти</button>
        </form>

        <form id="registerForm" class="form">
          <h3>Регистрация</h3>
          <label>Имя пользователя
            <input type="text" id="regUsername" required />
          </label>
          <label>Пароль
            <input type="password" id="regPassword" required />
          </label>
          <button type="submit">Зарегистрироваться</button>
        </form>
      </div>
      <div id="authMessage" class="message" aria-live="polite"></div>
    </section>

    <!-- APP: основное содержимое -->
    <section id="contentSection" class="content" style="display:none;">
      <section class="grid-controls">
        <div class="search-area">
          <input id="searchInput" placeholder="Поиск аниме через AniList..." />
          <button id="searchBtn">Поиск</button>
        </div>
      </section>

      <section id="animeList" class="grid"></section>

      <section id="playerSection" class="player" style="display:none;">
        <h2 id="playerTitle">Просмотр: </h2>
        <div class="player-area">
          <iframe id="episodePlayer" width="100%" height="360" src="" frameborder="0" allowfullscreen></iframe>
        </div>
        <div id="episodeList" class="episode-list"></div>
      </section>

      <section id="profileSection" class="profile" style="display:none;">
        <div class="profile-header">
          <div class="avatar-wrap">
            <img id="avatarImg" src="" alt="Аватар" class="avatar" />
            <input id="avatarInput" type="file" accept="image/*" />
          </div>
          <div class="profile-info">
            <h3 id="profileUsername"></h3>
          </div>
        </div>

        <div class="profile-lists">
          <div class="list-block">
            <h4>Избранное</h4>
            <ul id="listFavorites"></ul>
          </div>
          <div class="list-block">
            <h4>Просмотренные</h4>
            <ul id="listWatched"></ul>
          </div>
          <div class="list-block">
            <h4>Брошенные</h4>
            <ul id="listDropped"></ul>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
