<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kodik Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d1a;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .wrap { max-width: 1100px; margin: 0 auto; }
        .header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #7c3aed;
            cursor: pointer;
            white-space: nowrap;
        }
        .search {
            display: flex;
            flex: 1;
            gap: 10px;
            max-width: 500px;
        }
        .search input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 30px;
            border: 2px solid #2a2a4a;
            background: #1a1a2e;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .search input:focus { border-color: #7c3aed; }
        .search button {
            padding: 12px 24px;
            border-radius: 30px;
            border: none;
            background: #7c3aed;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        .search button:hover { background: #6d28d9; }
        .stats {
            display: flex;
            gap: 30px;
            padding: 15px 0;
            border-bottom: 1px solid #1a1a2e;
            margin-bottom: 20px;
            color: #888;
            font-size: 14px;
        }
        .stats span:last-child { color: #fff; }
        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            min-height: 200px;
        }
        .card {
            background: #1a1a2e;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #2a2a4a;
            transition: 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #7c3aed;
        }
        .card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
        }
        .card-body { padding: 12px; }
        .card-body h3 {
            font-size: 14px;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-body .info {
            font-size: 12px;
            color: #888;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 6px 0;
        }
        .card-body .info span {
            background: #2a2a4a;
            padding: 2px 10px;
            border-radius: 20px;
        }
        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty h3 { font-size: 22px; margin-top: 10px; }
        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #1a1a2e;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #player {
            margin-top: 30px;
            background: #1a1a2e;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #2a2a4a;
        }
        #player.hidden { display: none; }
        .player-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .player-top h2 { font-size: 18px; }
        .player-top .btns { display: flex; gap: 8px; }
        .player-top .btns button {
            background: #2a2a4a;
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .player-top .btns button:hover { background: #3a3a5a; }
        .player-top .btns .close:hover { background: #dc2626; }
        .player-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            padding: 10px;
            background: #0d0d1a;
            border-radius: 10px;
            align-items: center;
        }
        .player-controls select {
            background: #2a2a4a;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .player-controls .status {
            color: #7c3aed;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .player-wrap {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #0d0d1a;
            border-radius: 12px;
            overflow: hidden;
        }
        .player-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .msg {
            padding: 10px 14px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 14px;
        }
        .msg.info {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }
        .msg.success {
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.2);
            color: #4ade80;
        }
        .msg.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #1a1a2e;
            text-align: center;
            color: #555;
            font-size: 13px;
        }
        .btn-reload {
            background: #2a2a4a;
            border: none;
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
        }
        .btn-reload:hover { background: #3a3a5a; }
        .debug {
            margin-top: 10px;
            padding: 10px;
            background: #1a1a2e;
            border-radius: 8px;
            font-size: 12px;
            color: #888;
            display: none;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .debug.show { display: block; }
        @media (max-width: 600px) {
            .header { flex-direction: column; }
            .search { max-width: 100%; }
            #grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">
            <div class="logo" id="logoLink">🎬 AnimePlayer</div>
            <div class="search">
                <input type="text" id="searchInput" placeholder="Поиск аниме..." value="one piece">
                <button id="searchBtn">🔍 Найти</button>
            </div>
        </div>

        <div class="stats">
            <span>📊 AniList</span>
            <span>🎥 Kodik</span>
            <span id="count">0</span>
        </div>

        <div id="grid"></div>

        <div id="player" class="hidden">
            <div class="player-top">
                <h2 id="playerTitle">Название</h2>
                <div class="btns">
                    <button id="closePlayer" class="close">✕</button>
                </div>
            </div>
            <div class="player-controls">
                <select id="episodeSelect"></select>
                <select id="qualitySelect">
                    <option value="720">720p</option>
                    <option value="480">480p</option>
                    <option value="360">360p</option>
                </select>
                <span class="status" id="sourceStatus">⏳ Загрузка...</span>
                <button class="btn-reload" id="reloadBtn">🔄 Обновить</button>
            </div>
            <div class="player-wrap">
                <iframe id="playerFrame" src="" allowfullscreen></iframe>
            </div>
            <div id="statusMsg" class="msg info">💡 Выберите аниме</div>
            <div class="debug" id="debugInfo"></div>
        </div>

        <div class="footer">AniList · Kodik</div>
    </div>

    <script>
        // ============================================================
        // БРАУЗЕРНАЯ ВЕРСИЯ KODIK (БЕЗ NPM)
        // ============================================================

        (function() {
            'use strict';

            // ===== ПОЛУЧИТЬ ПУБЛИЧНЫЙ ТОКЕН =====
            async function getPublicToken() {
                try {
                    const response = await fetch('https://kodikapi.com/get-token');
                    const data = await response.json();
                    return data.token || data;
                } catch (error) {
                    console.error('Ошибка получения токена:', error);
                    return null;
                }
            }

            // ===== КЛИЕНТ KODIK =====
            let kodikToken = null;

            async function getKodikToken() {
                if (!kodikToken) {
                    kodikToken = await getPublicToken();
                }
                return kodikToken;
            }

            // ===== ЗАПРОС К KODIK API =====
            async function kodikRequest(endpoint, params = {}) {
                const token = await getKodikToken();
                if (!token) {
                    throw new Error('Не удалось получить токен Kodik');
                }

                const url = new URL(`https://kodikapi.com/${endpoint}`);
                url.searchParams.set('token', token);
                
                for (const [key, value] of Object.entries(params)) {
                    if (value) url.searchParams.set(key, value);
                }

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return response.json();
            }

            // DOM
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const grid = document.getElementById('grid');
            const count = document.getElementById('count');
            const logo = document.getElementById('logoLink');

            const player = document.getElementById('player');
            const playerTitle = document.getElementById('playerTitle');
            const playerFrame = document.getElementById('playerFrame');
            const closePlayer = document.getElementById('closePlayer');
            const episodeSelect = document.getElementById('episodeSelect');
            const qualitySelect = document.getElementById('qualitySelect');
            const statusMsg = document.getElementById('statusMsg');
            const sourceStatus = document.getElementById('sourceStatus');
            const reloadBtn = document.getElementById('reloadBtn');
            const debugInfo = document.getElementById('debugInfo');

            let currentResults = [];
            let currentAnime = null;
            let isLoading = false;
            let currentMaterial = null;

            // ===== ЗАПРОС К ANILIST =====
            const QUERY = `
                query ($search: String) {
                    Page(page: 1, perPage: 30) {
                        media(search: $search, type: ANIME, sort: POPULARITY_DESC) {
                            id
                            title { romaji english native }
                            coverImage { large extraLarge }
                            format
                            episodes
                            status
                            averageScore
                            genres
                        }
                    }
                }
            `;

            // ===== ПОИСК В KODIK =====
            async function searchKodik(title) {
                try {
                    debugInfo.textContent = `🔍 Поиск: "${title}"\n`;
                    debugInfo.classList.add('show');

                    const data = await kodikRequest('search', {
                        title: title,
                        limit: 1
                    });

                    debugInfo.textContent += `📦 Ответ: ${JSON.stringify(data, null, 2)}`;

                    if (data && data.results && data.results.length > 0) {
                        return data.results[0];
                    }
                    return null;
                } catch (error) {
                    debugInfo.textContent += `\n❌ Ошибка: ${error.message}`;
                    return null;
                }
            }

            // ===== ПОИСК ПО ID =====
            async function searchKodikById(id) {
                try {
                    debugInfo.textContent = `🔍 Поиск по ID: ${id}\n`;
                    debugInfo.classList.add('show');

                    const data = await kodikRequest('search', {
                        shikimori_id: id
                    });

                    debugInfo.textContent += `📦 Ответ: ${JSON.stringify(data, null, 2)}`;

                    if (data && data.results && data.results.length > 0) {
                        return data.results[0];
                    }
                    return null;
                } catch (error) {
                    debugInfo.textContent += `\n❌ Ошибка: ${error.message}`;
                    return null;
                }
            }

            // ===== ПОЛУЧИТЬ ВИДЕО-ССЫЛКИ =====
            async function getVideoLinks(link) {
                try {
                    debugInfo.textContent += `\n📹 Получение видео...`;

                    const data = await kodikRequest('get-links', {
                        link: link
                    });

                    debugInfo.textContent += `\n📦 Ответ: ${JSON.stringify(data, null, 2)}`;

                    return data;
                } catch (error) {
                    debugInfo.textContent += `\n❌ Ошибка: ${error.message}`;
                    return null;
                }
            }

            // ===== ПОИСК =====
            async function search(query) {
                if (!query?.trim()) {
                    showEmpty('Введите название');
                    updateCount(0);
                    return;
                }

                if (isLoading) return;
                isLoading = true;

                showLoading();
                updateCount('⏳');

                try {
                    const res = await fetch('https://graphql.anilist.co', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            query: QUERY,
                            variables: { search: query.trim() }
                        })
                    });

                    if (!res.ok) throw new Error(`HTTP ${res.status}`);

                    const json = await res.json();
                    if (json.errors) {
                        throw new Error(json.errors[0]?.message || 'Ошибка');
                    }

                    const media = json?.data?.Page?.media || [];
                    currentResults = media;

                    if (!media.length) {
                        showEmpty('Ничего не найдено');
                        updateCount(0);
                        return;
                    }

                    renderCards(media);
                    updateCount(media.length);

                } catch (err) {
                    console.error(err);
                    showEmpty(`❌ ${err.message}`);
                    updateCount('⚠️');
                } finally {
                    isLoading = false;
                }
            }

            // ===== КАРТОЧКИ =====
            function renderCards(list) {
                let html = '';
                for (const anime of list) {
                    const title = anime.title?.romaji || anime.title?.english || 'Без названия';
                    const cover = anime.coverImage?.extraLarge || anime.coverImage?.large || '';
                    const genres = (anime.genres || []).slice(0, 2).join(' · ');
                    const score = anime.averageScore ? Math.round(anime.averageScore / 10) : '—';
                    const episodes = anime.episodes || '?';
                    const status = anime.status || 'UNKNOWN';
                    const statusLabel = status === 'RELEASING' ? '🟢 Выходит' : status === 'FINISHED' ? '🔵 Завершён' : '⚪ Скоро';

                    html += `
                        <div class="card" data-id="${anime.id}" data-title="${encodeURIComponent(title)}">
                            <img src="${cover}" alt="${title}" loading="lazy"
                                 onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22450%22%3E%3Crect fill=%22%231a1a2e%22 width=%22300%22 height=%22450%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 font-size=%2220%22 fill=%22%23666%22 text-anchor=%22middle%22 dominant-baseline=%22central%22%3ENo Image%3C/text%3E%3C/svg%3E'" />
                            <div class="card-body">
                                <h3>${escapeHtml(title)}</h3>
                                ${genres ? `<div style="font-size:12px;color:#888;">${escapeHtml(genres)}</div>` : ''}
                                <div class="info">
                                    <span>${anime.format || 'TV'}</span>
                                    <span>⭐ ${score}</span>
                                    <span>${episodes} эп.</span>
                                </div>
                                <div style="font-size:12px;color:#666;margin-top:4px;">${statusLabel}</div>
                            </div>
                        </div>
                    `;
                }
                grid.innerHTML = html;

                document.querySelectorAll('.card').forEach(el => {
                    el.addEventListener('click', async function() {
                        const id = parseInt(this.dataset.id);
                        const title = decodeURIComponent(this.dataset.title);
                        const anime = currentResults.find(a => a.id === id);
                        if (anime) {
                            await openPlayer(anime, title);
                        }
                    });
                });
            }

            // ===== ОТКРЫТЬ ПЛЕЕР =====
            async function openPlayer(anime, title) {
                currentAnime = anime;
                const animeTitle = title || anime.title?.romaji || anime.title?.english || 'Аниме';

                player.classList.remove('hidden');
                playerTitle.textContent = '🎬 ' + animeTitle;

                const total = anime.episodes || 12;
                episodeSelect.innerHTML = '';
                for (let i = 1; i <= Math.min(total, 50); i++) {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = `Серия ${i}`;
                    episodeSelect.appendChild(opt);
                }

                setStatus(`⏳ Поиск в Kodik...`, 'info');
                sourceStatus.textContent = `🔍 Поиск...`;
                debugInfo.textContent = `📺 ${animeTitle} (ID: ${anime.id})\n`;
                debugInfo.classList.add('show');

                try {
                    // Ищем сначала по ID
                    let material = await searchKodikById(anime.id);
                    
                    if (!material) {
                        debugInfo.textContent += `\n⚠️ По ID не найдено, ищем по названию...`;
                        material = await searchKodik(animeTitle);
                    }

                    if (material) {
                        currentMaterial = material;
                        debugInfo.textContent += `\n✅ Найдено: ${material.title || material.id}`;
                        setStatus(`✅ Найдено в Kodik!`, 'success');
                        sourceStatus.textContent = `📹 Получение видео...`;

                        if (material.link) {
                            // Получаем видео-ссылки
                            const links = await getVideoLinks(material.link);
                            
                            if (links && Object.keys(links).length > 0) {
                                playVideo(links);
                            } else {
                                // Если не получили ссылки - пробуем прямой плеер
                                let playerUrl = material.link;
                                if (playerUrl.startsWith('//')) {
                                    playerUrl = 'https:' + playerUrl;
                                }
                                playerFrame.src = playerUrl;
                                setStatus(`✅ Загружен плеер Kodik`, 'success');
                                sourceStatus.textContent = '🎬 Плеер';
                            }
                        } else {
                            setStatus('❌ Нет ссылки на материал', 'error');
                            sourceStatus.textContent = '❌ Ошибка';
                        }
                    } else {
                        setStatus(`❌ Не найдено в Kodik`, 'error');
                        sourceStatus.textContent = '❌ Не найдено';
                        debugInfo.textContent += `\n❌ Ничего не найдено`;
                    }

                } catch (error) {
                    console.error('Open player error:', error);
                    setStatus(`❌ Ошибка: ${error.message}`, 'error');
                    sourceStatus.textContent = '❌ Ошибка';
                    debugInfo.textContent += `\n❌ Ошибка: ${error.message}`;
                }

                setTimeout(() => {
                    player.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            }

            // ===== ВОСПРОИЗВЕДЕНИЕ ВИДЕО =====
            function playVideo(links) {
                const qualities = Object.keys(links).sort((a, b) => parseInt(a) - parseInt(b));
                
                if (qualities.length === 0) {
                    setStatus('❌ Нет доступных качеств', 'error');
                    return;
                }

                qualitySelect.innerHTML = '';
                qualities.forEach(q => {
                    const opt = document.createElement('option');
                    opt.value = q;
                    opt.textContent = `${q}p`;
                    qualitySelect.appendChild(opt);
                });

                const bestQuality = qualities[qualities.length - 1];
                qualitySelect.value = bestQuality;

                let videoUrl = links[bestQuality][0].src;
                if (videoUrl.startsWith('//')) {
                    videoUrl = 'https:' + videoUrl;
                }

                debugInfo.textContent += `\n▶️ Качество: ${bestQuality}p`;
                debugInfo.textContent += `\n🔗 Ссылка: ${videoUrl}`;

                playerFrame.src = videoUrl;
                setStatus(`▶️ Воспроизведение ${bestQuality}p`, 'success');
                sourceStatus.textContent = `🎬 ${bestQuality}p`;
            }

            // ===== СМЕНА КАЧЕСТВА =====
            async function changeQuality() {
                if (currentMaterial && currentMaterial.link) {
                    const links = await getVideoLinks(currentMaterial.link);
                    if (links) {
                        const quality = qualitySelect.value;
                        let videoUrl = links[quality][0].src;
                        if (videoUrl.startsWith('//')) {
                            videoUrl = 'https:' + videoUrl;
                        }
                        playerFrame.src = videoUrl;
                        setStatus(`▶️ ${quality}p`, 'success');
                        sourceStatus.textContent = `🎬 ${quality}p`;
                    }
                }
            }

            // ===== СМЕНА СЕРИИ =====
            async function changeEpisode() {
                if (currentAnime) {
                    const title = currentAnime.title?.romaji || currentAnime.title?.english || 'Аниме';
                    await openPlayer(currentAnime, title);
                }
            }

            // ===== ОБНОВИТЬ =====
            async function reloadPlayer() {
                if (currentAnime) {
                    const title = currentAnime.title?.romaji || currentAnime.title?.english || 'Аниме';
                    await openPlayer(currentAnime, title);
                }
            }

            // ===== СТАТУС =====
            function setStatus(msg, type) {
                statusMsg.textContent = msg;
                statusMsg.className = 'msg ' + (type || 'info');
            }

            // ===== ЗАКРЫТЬ =====
            function closePlayerFn() {
                player.classList.add('hidden');
                playerFrame.src = '';
                currentAnime = null;
                currentMaterial = null;
                debugInfo.classList.remove('show');
            }

            // ===== НА ГЛАВНУЮ =====
            function goHome() {
                closePlayerFn();
                showEmpty('Найдите аниме');
                updateCount(0);
                document.querySelector('.header').scrollIntoView({ behavior: 'smooth' });
            }

            // ===== UI =====
            function showEmpty(msg) {
                grid.innerHTML = `
                    <div class="empty">
                        <div style="font-size:48px;">🔍</div>
                        <h3>${msg}</h3>
                        <p style="color:#555;">Введите название</p>
                    </div>
                `;
            }

            function showLoading() {
                grid.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p style="color:#888;margin-top:12px;">Загрузка...</p>
                    </div>
                `;
            }

            function updateCount(val) {
                if (typeof val === 'number') {
                    count.textContent = `${val} аниме`;
                } else {
                    count.textContent = val;
                }
            }

            function escapeHtml(text) {
                const d = document.createElement('div');
                d.textContent = text;
                return d.innerHTML;
            }

            // ===== СОБЫТИЯ =====
            searchBtn.addEventListener('click', () => {
                search(searchInput.value.trim());
            });

            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchBtn.click();
            });

            closePlayer.addEventListener('click', closePlayerFn);
            episodeSelect.addEventListener('change', changeEpisode);
            qualitySelect.addEventListener('change', changeQuality);
            reloadBtn.addEventListener('click', reloadPlayer);

            logo.addEventListener('click', (e) => {
                e.preventDefault();
                goHome();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !player.classList.contains('hidden')) {
                    closePlayerFn();
                }
            });

            // ===== ЗАПУСК =====
            showEmpty('Найдите аниме');
            updateCount(0);

            // Проверяем получение токена
            getPublicToken().then(token => {
                console.log('✅ Токен Kodik получен:', token);
            }).catch(err => {
                console.error('❌ Ошибка получения токена:', err);
            });

            setTimeout(() => {
                search('one piece');
            }, 300);

        })();
    </script>
</body>
</html>
