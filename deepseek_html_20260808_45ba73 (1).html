<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeWave - Смотреть аниме онлайн</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app">
        <!-- Шапка -->
        <header class="header">
            <div class="logo" id="logoLink">
                <i class="fas fa-bolt"></i>
                <span>Anime<span>Wave</span></span>
            </div>
            <div class="search-wrap">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Поиск аниме...">
                <button id="searchBtn"><i class="fas fa-arrow-right"></i></button>
            </div>
        </header>

        <!-- Статистика -->
        <div class="stats">
            <div class="stat-item">
                <i class="fas fa-database"></i>
                <span>AniList API</span>
            </div>
            <div class="stat-item">
                <i class="fas fa-play-circle"></i>
                <span>Встроенный плеер</span>
            </div>
            <div class="stat-item" id="count">
                <i class="fas fa-list"></i>
                <span>0 аниме</span>
            </div>
        </div>

        <!-- Сетка -->
        <div id="grid" class="grid"></div>

        <!-- Плеер с возможностью сворачивания -->
        <div id="player" class="player hidden">
            <div class="player-header">
                <div class="player-title">
                    <i class="fas fa-play-circle"></i>
                    <h2 id="playerTitle">Название аниме</h2>
                </div>
                <div class="player-actions">
                    <button id="collapsePlayer" class="btn-collapse" title="Свернуть/Развернуть">
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <button onclick="window.goHome()" class="btn-home" title="На главную">
                        <i class="fas fa-home"></i>
                    </button>
                    <button id="closePlayer" class="btn-close" title="Закрыть">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <!-- Содержимое плеера (сворачивается) -->
            <div class="player-body" id="playerBody">
                <div class="player-controls">
                    <div class="episode-group">
                        <label><i class="fas fa-list"></i> Серия:</label>
                        <select id="episodeSelect"></select>
                    </div>
                    <div class="source-status" id="sourceStatus">
                        <i class="fas fa-sync-alt fa-spin"></i>
                        <span>Загрузка...</span>
                    </div>
                </div>

                <div class="player-wrapper">
                    <iframe id="playerFrame" src="" allowfullscreen></iframe>
                </div>

                <div id="statusMsg" class="status-msg info">
                    <i class="fas fa-info-circle"></i>
                    <span>Выберите аниме для просмотра</span>
                </div>
            </div>
        </div>

        <!-- Мини-плеер (когда свернут) -->
        <div id="miniPlayer" class="mini-player hidden">
            <div class="mini-player-content">
                <div class="mini-info">
                    <i class="fas fa-play-circle" style="color:#7c3aed;"></i>
                    <span id="miniTitle">Название</span>
                </div>
                <div class="mini-actions">
                    <button id="expandPlayer" class="btn-expand" title="Развернуть">
                        <i class="fas fa-chevron-up"></i>
                    </button>
                    <button id="closeMiniPlayer" class="btn-close-mini" title="Закрыть">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Футер -->
        <footer class="footer">
            <p>
                <i class="fas fa-code"></i> 
                Данные от <a href="https://anilist.co" target="_blank">AniList</a> · 
                Бесплатный встроенный плеер
            </p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
